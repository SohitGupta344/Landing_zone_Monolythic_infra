
pool: Default
trigger:
-  main 
stages:
- stage: PreCommit
  displayName: Pre-Commit / Static Analysis Stage
  pool: Default
  jobs: 
  - job: TerraformValidate
    displayName: Terraform Validate
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'ericsson'
        backendAzureRmResourceGroupName: 'sohit-rg'
        backendAzureRmStorageAccountName: 'sohittfstate001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sohit.terraform.tfstate'''
        commandOptions: "-upgrade"
    - task: TerraformTask@5
      displayName: validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
  - job: TerraformFmt
    dependsOn: TerraformValidate
    displayName: Terraform Fmt
    steps:
    - task: TerraformTask@5
      displayName: fmt
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'ericsson'
  - job: gitleaks
    dependsOn: TerraformFmt
    displayName: gitleaks
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(Build.SourcesDirectory)\env\dev"
          
          gitleaks dir .
          
          gitleaks dir . --report-format json --report-path gitleaks-report.json
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'gitleaks-report.json'
        publishLocation: 'Container'
    
  - job: tflint
    dependsOn: gitleaks
    displayName: TFLint
    steps:
    - task: PowerShell@2
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(Build.SourcesDirectory)\env\dev"
          
          tflint
          
          tflint --format compact > tflint.txt

    - task: PublishBuildArtifacts@1
      displayName: tflint
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'tflint.txt'
        publishLocation: 'Container'

  - job: tfsec
    dependsOn: tflint
    displayName: tfsec
    steps:
    - task: PowerShell@2
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(Build.SourcesDirectory)\env\dev"
          
          tfsec .
          
          tfsec . --format json --out tfsec-report

    - task: PublishBuildArtifacts@1
      displayName: tfsec
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'tfsec-report'
        publishLocation: 'Container'


- stage: Infra_Cost
  dependsOn: PreCommit
  jobs:
    - job: 
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            Set-Location "$(Build.SourcesDirectory)\env\dev"
            
            infracost breakdown --path .
            
            infracost breakdown --path . --format json --out-file infracost.json

      - task: PublishBuildArtifacts@1
        displayName: infracost
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'infracost.json'
          publishLocation: 'Container'

- stage: plan
  displayName: Plan & Review Stage
  jobs: 
  - job: TerraformPlan
    displayName: Terraform Plan
    pool: Default
    steps: 
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'ericsson'
        backendAzureRmStorageAccountName: 'sohittfstate001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sohit.terraform.tfstate'
        commandOptions: "-upgrade"
    - task: TerraformTask@5
      displayName: plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'ericsson'
- stage: approval
  dependsOn: plan
  displayName: Approval & Governance Stage
  jobs:
  - job: ManualApproval
    displayName: Manual Approval
    pool: server
    steps: 
    - task: ManualValidation@1
      inputs:
        notifyUsers: 'sohitg89@gmail.com'
        approvers: 'sohitg89@gmail.com'
- stage: apply
  dependsOn: approval
  displayName: Deploy / Apply Stage
  jobs:
  - job: TerraformApply
    displayName: Terraform Apply
    pool: Default
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'ericsson'
        backendAzureRmStorageAccountName: 'sohittfstate001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sohit.terraform.tfstate'
        commandOptions: "-upgrade"
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'ericsson'