
pool: Default
trigger:
-  main 
stages:
- stage: PreCommit
  displayName: Pre-Commit / Static Analysis Stage
  pool: Default
  jobs: 
  - job: TerraformValidate
    displayName: Terraform Validate
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'ericsson'
        backendAzureRmResourceGroupName: 'sohit-rg'
        backendAzureRmStorageAccountName: 'sohittfstate001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sohit.terraform.tfstate'''
        commandOptions: "-upgrade"
    - task: TerraformTask@5
      displayName: validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
  - job: TerraformFmt
    dependsOn: TerraformValidate
    displayName: Terraform Fmt
    steps:
    - task: TerraformTask@5
      displayName: fmt
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'ericsson'
  - job: tfsec
    dependsOn: TerraformFmt
    displayName: TfSec Scan
    steps:
    - task: tfsec@1
      inputs:
        version: 'v1.26.0'
        dir: '$(System.DefaultWorkingDirectory)/env/dev'
  - job: tflint
    dependsOn: tfsec
    displayName: TFLint
    steps:
    - task: PowerShell@2
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(Build.SourcesDirectory)\env\dev"
          
          tflint
          
          tflint --format compact > tflint.txt
        errorActionPreference: 'continue'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'

- stage: Infra_Cost
  dependsOn: PreCommit
  jobs:
    - job: 
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: |
            Set-Location "$(Build.SourcesDirectory)\env\dev"
            
            infracost breakdown --path .
            
            infracost breakdown --path . --format json --out-file infracost.json

- stage: plan
  displayName: Plan & Review Stage
  jobs: 
  - job: TerraformPlan
    displayName: Terraform Plan
    pool: Default
    steps: 
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'ericsson'
        backendAzureRmStorageAccountName: 'sohittfstate001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sohit.terraform.tfstate'
        commandOptions: "-upgrade"
    - task: TerraformTask@5
      displayName: plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'ericsson'
- stage: approval
  dependsOn: plan
  displayName: Approval & Governance Stage
  jobs:
  - job: ManualApproval
    displayName: Manual Approval
    pool: server
    steps: 
    - task: ManualValidation@1
      inputs:
        notifyUsers: 'sohitg89@gmail.com'
        approvers: 'sohitg89@gmail.com'
- stage: apply
  dependsOn: approval
  displayName: Deploy / Apply Stage
  jobs:
  - job: TerraformApply
    displayName: Terraform Apply
    pool: Default
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'ericsson'
        backendAzureRmStorageAccountName: 'sohittfstate001'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'sohit.terraform.tfstate'
        commandOptions: "-upgrade"
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'ericsson'